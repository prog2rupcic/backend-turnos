spring.application.name=backend-turnos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/turnos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:turnos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:turnos}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
turnos.security.jwt-secret=${TURNOS_USER_JWT_SECRET}
turnos.security.issuer=${TURNOS_USER_JWT_ISSUER:backend-turnos}
turnos.security.session-ttl=${TURNOS_USER_JWT_TTL:PT1H}
turnos.security.remember-me-ttl=${TURNOS_USER_JWT_REMEMBER_ME_TTL:P7D}
