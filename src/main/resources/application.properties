spring.application.name=backend-turnos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/turnos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:turnos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:turnos}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
turnos.security.jwt-secret=${TURNOS_USER_JWT_SECRET}
turnos.security.issuer=${TURNOS_USER_JWT_ISSUER:backend-turnos}
turnos.security.session-ttl=${TURNOS_USER_JWT_TTL:PT1H}
turnos.security.remember-me-ttl=${TURNOS_USER_JWT_REMEMBER_ME_TTL:P7D}
turnos.catalog.base-url=${TURNOS_CATALOG_BASE_URL}
turnos.catedra.base-url=${CATEDRA_REST_URL}
turnos.catedra.technical-jwt=${CATEDRA_TECHNICAL_JWT}
turnos.availability.zone-id=${TURNOS_AVAILABILITY_ZONE_ID:America/Argentina/Buenos_Aires}
spring.kafka.bootstrap-servers=${TURNOS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${TURNOS_KAFKA_CONSUMER_GROUP_ID:backend-turnos}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
turnos.kafka.enabled=${TURNOS_KAFKA_ENABLED:false}
turnos.kafka.actions-topic=${TURNOS_KAFKA_ACTIONS_TOPIC:catedra.turnos.acciones}
turnos.kafka.phone-topic=${TURNOS_KAFKA_PHONE_TOPIC:}
turnos.integration.group-id=${TURNOS_INTEGRATION_GROUP_ID:}
turnos.outbox.interval=${TURNOS_OUTBOX_INTERVAL:2000}
spring.kafka.consumer.properties[allow.auto.create.topics]=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[delivery.timeout.ms]=15000
spring.kafka.producer.properties[request.timeout.ms]=5000
spring.kafka.producer.properties[max.block.ms]=5000
