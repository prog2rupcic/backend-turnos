services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - turnos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - turnos_private

  turnos:
    build: .
    env_file: ${TURNOS_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - turnos_private
      - turnos_integration

volumes:
  turnos_db:

networks:
  turnos_private:
    name: turnos-private
    ipam:
      config:
        - subnet: 172.28.0.0/16
  turnos_integration:
    name: turnos-integracion
    external: true
